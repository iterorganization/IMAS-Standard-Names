  # Named characteristic timescales are atomic bases (like confinement_time,
  # dead_time) — a timescale is a named quantity (has a symbol/definition), not
  # "time, X-flavored". The bare `time` base is the time coordinate/elapsed time
  # and must not take due_to_<process> (see the time-base guard in model.py).
