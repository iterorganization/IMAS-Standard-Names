on:
  workflow_call:
    outputs:
      priority:
        description: 'Priority label to be added to the issue.'
        value: ${{ jobs.parse-issue.outputs.priority }}
      has-name:
        description: 'True if the proposed Standard Name exists in the standardnames.yml file.'
        value: ${{ jobs.parse-issue.outputs.has-name }} 
        
jobs:
  parse-issue:
    runs-on: ubuntu-latest
    outputs:
      priority: ${{ steps.issue-parser.outputs.issueparser_priority }}
      has-name: ${{ steps.has-name.outputs.status }}
    
    steps:
    - uses: actions/checkout@v3
    - uses: stefanbuck/github-issue-parser@v3
      id: issue-parser
      with:
        template-path: .github/ISSUE_TEMPLATE/standard-name.yml

    - uses: actions/setup-python@v3
      with:
        python-version: "3.12"
    - name: Install imas-standard-names
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Check for existing Standard Name
      id: has-name
      run: echo "status=$(has_standardname standardnames.yml ${{ steps.issue-parser.outputs.issueparser_name }}) == True" >> $GITHUB_OUTPUT
