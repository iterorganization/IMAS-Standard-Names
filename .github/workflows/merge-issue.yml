on:
  issues:
    types: [labeled]

jobs:

  parse-issue:
    uses: ./.github/workflows/parse-issue.yml

  label-issue:
    uses: ./.github/workflows/label-issue.yml
  
  merge-issue:
    if: ${{ github.event.label.name == 'merge' }}
    runs-on: ubuntu-latest
    needs: [parse-issue,label-issue]

    steps:

      - uses: actions/checkout@v3
      - uses: actions/setup-python@v3
        with:
          python-version: "3.12"
      - name: Install imas-standard-names
        run: |
          python -m pip install --upgrade pip
          pip install .
        
      - name: Update standardnames.yml
        id: update-standardnames
        if: ${{ !needs.label-issue.outputs.has-name }} || ${{ needs.parse-issue.outputs.overwrite }}
        run: update_standardnames standardnames.yml submission.json
        continue-on-error: true

      - name: Remove merge label
        if: steps.update-standardnames.outcome != 'success'
        #env:
        #  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        #  ISSUE_URL: ${{ github.event.issue.html_url }}
        run: gh issue edit $ISSUE_URL --remove-label "merge"

      # - run: node submission.js

      # - run: yarn
      
      # - run: node ./update.js
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # - run: node ./generate-readme.js

      # - run: |
      #       git config user.email "github@stefanbuck.com"
      #       git config user.name "Stefan Buck"
      #       git add README.md data.json
      #       git diff-index --quiet HEAD || git commit -m "Add new list item"

      # - run: git push

      - name: Close issue
        if: steps.update-standardnames.outcome == 'success'
        uses: peter-evans/close-issue@v1
        with:
          comment: Merged **${{ needs.parse-issue.outputs.standard-name }}** with <a href="../">standardnames.yml</a>.
