on:
  issues:
    types: [labeled]

jobs:

  parse-issue:
    uses: ./.github/workflows/parse-issue.yml

  merge-issue:
    if: ${{ github.event.label.name == 'merge' }}
    runs-on: ubuntu-latest
    needs: parse-issue

    steps:

      - uses: actions/checkout@v3
      - uses: actions/setup-python@v3
        with:
          python-version: "3.12"
      - name: Install imas-standard-names
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Update
        run: |
          echo '${{ needs.parse-issue.outputs.submission }}' > submission.json
          echo "update=$(update_standardnames standardnames.yml submission.json)" >> $GITHUB_ENV

      - name: Remove merge label on error
        if: contains(env.update, 'Error')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: gh issue edit $ISSUE_URL --remove-label "merge"

      - name: Update issue with error message as comment
        if: contains(env.update, 'Error')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: gh issue comment $ISSUE_URL --body $'"${{ env.update }}"'

      # - run: node submission.js

      # - run: yarn
      
      # - run: node ./update.js
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # - run: node ./generate-readme.js

      # - run: |
      #       git config user.email "github@stefanbuck.com"
      #       git config user.name "Stefan Buck"
      #       git add README.md data.json
      #       git diff-index --quiet HEAD || git commit -m "Add new list item"

      # - run: git push

      - name: Close issue
        if: contains(env.update, 'Success')
        uses: peter-evans/close-issue@v1
        with:
          comment: Merged **${{ needs.parse-issue.outputs.standard-name }}** with <a href="../">standardnames.yml</a>.
