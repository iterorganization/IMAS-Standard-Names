on:
  issues:
    types: [opened,edited]

jobs:
    
  parse-issue:
    uses: ./.github/workflows/parse-issue.yml

  label-issue:
    runs-on: ubuntu-latest
    needs: parse-issue

    steps:

      - name: Add priority label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          gh issue edit $ISSUE_URL --add-label "${{ needs.parse-issue.outputs.priority }}"

      - name: Add duplicate label
        if: ${{ needs.parse-issue.outputs.has-name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: gh issue edit $ISSUE_URL --add-label "duplicate"