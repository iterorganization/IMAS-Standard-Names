on:
  issues:
    types:
      - opened

jobs:
  parse-issue:
    uses: ./.github/workflows/parse-issue.yml

  label-issue:
    runs-on: ubuntu-latest
    needs: parse-issue

    steps:
      - uses: actions/checkout@v3
      - uses: stefanbuck/github-issue-parser@v3
        id: issue-parser
        with:
          template-path: .github/ISSUE_TEMPLATE/standard-name.yml

      - name: Label Priority
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          gh issue edit $ISSUE_URL --add-label "${{ needs.parse-issue.outputs.priority }}"

      - uses: actions/setup-python@v3
        with:
          python-version: "3.12"
      - name: Install imas-standard-names
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Has name
        id: has-name
        run: echo "status=$(has_standardname standardnames.yml ${{ steps.issue-parser.outputs.issueparser_name }}) == True" >> $GITHUB_OUTPUT

      - name: Label Duplicate
        if: ${{ steps.has-name.outputs.status }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: gh issue edit $ISSUE_URL --add-label "duplicate"