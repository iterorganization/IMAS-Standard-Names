on:
  issues:
    types: [labeled]
jobs:
  setup:
    if: ${{ github.event.label.name == 'merge' }}

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: stefanbuck/github-issue-parser@v3
        id: issue-parser
        with:
          template-path: .github/ISSUE_TEMPLATE/standard-name.yml

      - run: echo '${{ steps.issue-parser.outputs.jsonString }}' > submission.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v3
        with:
          python-version: "3.12"
      - name: Install imas-standard-names
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Check for existing Standard Name
        id: check-name
        run: echo "status=$(is_standardname standardnames.yml ${{ steps.issue-parser.outputs.issueparser_name }}) == True" >> $GITHUB_OUTPUT

      - name: Update standardnames.yml
        id: update-standardnames
        if: ${{ !steps.check-name.outputs.status }} || ${{ steps.issue-parser.outputs.issueparser_overwrite }} == 'Overwrite'
        run: update_standardnames standardnames.yml submission.json
        continue-on-error: true

      - name: Update failure
        if: steps.update-standardnames.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          gh issue edit $ISSUE_URL --remove-label "merge"
          exit 1

      # - run: node submission.js

      # - run: yarn
      
      # - run: node ./update.js
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # - run: node ./generate-readme.js

      # - run: |
      #       git config user.email "github@stefanbuck.com"
      #       git config user.name "Stefan Buck"
      #       git add README.md data.json
      #       git diff-index --quiet HEAD || git commit -m "Add new list item"

      # - run: git push

      - uses: peter-evans/close-issue@v1
        with:
          comment: Merged **${{ steps.issue-parser.outputs.issueparser_name }}** with <a href="../">standardnames.yml</a>.
