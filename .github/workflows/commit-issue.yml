on:
  issues:
    types: [labeled]
jobs:
  setup:
    if: ${{ github.event.label.name == 'merge' }}

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: stefanbuck/github-issue-parser@v3
        id: issue-parser
        with:
          template-path: .github/ISSUE_TEMPLATE/standard-name.yml

      - run: echo '${{ steps.issue-parser.outputs.jsonString }}' > submission.json
        env:
          standard_name: ${{ steps.issue-parser.outputs.issueparser_name }}
          overwrite: ${{ steps.issue-parser.outputs.issueparser_overwrite }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v3
        with:
          python-version: "3.12"
      - name: Install imas-standard-names
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Check Standard Name
        id: is-standard-name
        run: |
          echo "::set-output name=status::$(is_standardname standardnames.yml $standard_name)"

      - name: Echo Standard Name
        run: |
          echo "${{ steps.is-standard-name.outputs.status }}"
          echo "${{ contains(steps.is-standard-name.outputs.status, 'True') }}"
        env:
          found_standard_name: ${{ steps.is-standard-name.outputs.status }}

      - name: Update standardnames.yml
        run: |
          update_standardnames standardnames.yml submission.json

      # - run: node submission.js

      # - run: yarn
      
      # - run: node ./update.js
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # - run: node ./generate-readme.js

      # - run: |
      #       git config user.email "github@stefanbuck.com"
      #       git config user.name "Stefan Buck"
      #       git add README.md data.json
      #       git diff-index --quiet HEAD || git commit -m "Add new list item"

      # - run: git push

      - uses: peter-evans/close-issue@v1
        with:
          comment: Merged **${{ steps.issue-parser.outputs.issueparser_name }}** with <a href="../">standardnames.yml</a>.
